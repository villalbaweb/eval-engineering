name: smoke
description: Fast sanity check (code graders only, no judge needed). Run on every change.
agent: copilot-baseline
datasets: [skill-selection, tool-use]
max_tasks: null
graders:
  - { type: skill_selection }
  - { type: tool_called }
  - { type: tool_not_called }
  - { type: answer_contains }
  - { type: step_efficiency }
run:
  k: 1
  concurrency: 4
  timeout_s: 90
  tool_mode: live
  fail_fast: true
  max_tasks: 8
