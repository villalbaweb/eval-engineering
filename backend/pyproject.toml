[project]
name = "eval-harness"
version = "0.1.0"
description = "Evaluation-engineering lab around a toy LangChain create_agent agent"
requires-python = ">=3.12"
dependencies = [
  "langchain>=1.0",
  "langgraph>=1.0",
  "langchain-openrouter",
  "langchain-tavily",
  "langsmith",
  "agentevals",
  "openevals",
  "fastapi",
  "uvicorn[standard]",
  "sse-starlette",
  "pydantic>=2",
  "pydantic-settings",
  "sqlmodel",
  "typer",
  "rich",
  "pyyaml",
  "jinja2",
  "httpx",
  "rank-bm25",
  "markdownify",
  "duckduckgo-search",
  "numpy",
  "scipy",
  "tzdata",
]

[project.optional-dependencies]
openai = ["langchain-openai"]
anthropic = ["langchain-anthropic"]
google = ["langchain-google-genai"]
vertex = ["langchain-google-vertexai"]
postgres = ["psycopg[binary]"]

[project.scripts]
evalh = "eval_harness.cli.main:app"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "types-pyyaml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_harness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP046"]  # long lines are fine in tables/prompts; Generic[T] is intentional
